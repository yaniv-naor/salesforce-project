name: Salesforce CI

on:
  pull_request:
    branches:
      - dev
      - test
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Salesforce Validate
    runs-on: ubuntu-latest

    environment:
      name: ${{ github.base_ref == 'dev' && 'dev' || github.base_ref == 'test' && 'test' || 'prod-validation' }}

    steps:
      - name: Checkout Salesforce Project
        uses: actions/checkout@v4

      - name: Checkout CI/CD Engine
        uses: actions/checkout@v4
        with:
          repository: yaniv-naor/salesforce-cicd
          path: salesforce-cicd

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version --json

      - name: Copy Configuration File
        run: |
          mkdir -p config
          cp salesforce-cicd/config/config.json config/config.json

      - name: Configure Authentication URL
        env:
          auth_url: ${{ secrets.AUTH_URL }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          config_path = Path("config/config.json")
          content = config_path.read_text(encoding="utf-8")
          content = content.replace("#{auth_url}#", os.environ["auth_url"])
          config_path.write_text(content, encoding="utf-8")
          PY

      - name: Authenticate
        env:
          auth_url: ${{ secrets.AUTH_URL }}
          SF_TARGET_ENV: ${{ vars.SF_TARGET_ENV }}
        run: python salesforce-cicd/cicd.py authenticate

      - name: Prepare
        env:
          SF_TARGET_ENV: ${{ vars.SF_TARGET_ENV }}
        run: python salesforce-cicd/cicd.py prepare

      - name: Validate
        env:
          SF_TARGET_ENV: ${{ vars.SF_TARGET_ENV }}
        run: python salesforce-cicd/cicd.py validate
