
name: Salesforce CI/CD

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Salesforce project
        uses: actions/checkout@v4

      - name: Checkout Salesforce CICD repository
        uses: actions/checkout@v4
        with:
          # שם המשתמש/הארגון ושם המאגר האחר
          repository: 'yaniv-naor/salesforce-cicd'
          
          # לאיזו תיקייה בתוך השרת להוריד את המאגר האחר (כדי שלא יקרוס על האפליקציה)
          path: 'salesforce-cicd'



      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli



      # - name: Configure environment variables
      #   env:
      #     auth_url: ${{ secrets.auth_url }}
      #     SF_TARGET_ENV: ${{ vars.SF_TARGET_ENV }}
      #   run: |
      #     echo "SF_TARGET_ENV: $SF_TARGET_ENV"
      #     sf --version
      #     python --version


      - name: Configure Salesforce authentication
        env:
          auth_url: ${{ secrets.auth_url }}
        run: |
          python -c "import os; from pathlib import Path; p = Path('config/config.json'); content = p.read_text(); p.write_text(content.replace('#{auth_url}#', os.environ['auth_url']))"


      - name: Authenticate Salesforce
        env:
          auth_url: ${{ secrets.auth_url }}
          SF_TARGET_ENV: ${{ vars.SF_TARGET_ENV }}
        run: python salesforce-cicd/cicd.py authenticate


      - name: Debug Salesforce CLI output
        if: always()
        run: |
          sf org login sfdx-url --sfdx-url-file config/config.json --json

      # - name: Check Salesforce authentication
      #   if: always()
      #   run: |
      #     sf org display --target-org $(cat salesforce-cicd/target_org.txt) --json


      - name: Check Salesforce authentication
        if: always()
        run: |
          echo "Target org file:"
          cat salesforce-cicd/target_org.txt
          echo "Authenticated orgs:"
          sf org list --json