
name: Salesforce CI/CD

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Salesforce project
        uses: actions/checkout@v4

      - name: Test workflow
        run: |
          echo "Salesforce CI/CD workflow is running!"
          echo "Current directory:"
          pwd
          echo "Project files:"
          ls -la

      - name: Checkout salesforce cicd repository
        uses: actions/checkout@v4
        with:
          # שם המשתמש/הארגון ושם המאגר האחר
          repository: 'yaniv-naor/salesforce-cicd'
          
          # לאיזו תיקייה בתוך השרת להוריד את המאגר האחר (כדי שלא יקרוס על האפליקציה)
          path: 'salesforce-cicd'

      - name: Test files
        run: |
          echo "CI/CD tool files:"
          ls -la salesforce-cicd


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
